# Netlify site for the Payload admin (project: craigesbikes-admin).
#
# This is a SECOND Netlify site, separate from the storefront:
#   storefront site -> repo root, static export, publishes out/
#   admin site      -> this folder, server-rendered via Netlify's Next runtime
#
# The admin is server-rendered: Payload's dashboard and REST API only exist as
# serverless functions. If the Next.js plugin does not run, Netlify uploads this
# directory as plain files and every route 404s.

[build]
  base = "cms"
  command = "npm ci --include=dev && npm run build && (npm run db:setup || echo \"db:setup failed - see /health\")"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.0"
  # The storefront sets this to "true" to opt out of server rendering.
  # The admin cannot run without it, so force it off here.
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Declared explicitly rather than relying on framework auto-detection, which
# did not engage on the first deploy.
[[plugins]]
  package = "@netlify/plugin-nextjs"
